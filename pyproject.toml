[project]
name = "hermes-artifacts"
version = "0.1.0"
description = "Private artifact library for Hermes with explicit, expiring guest shares"
requires-python = ">=3.14,<3.15"
dependencies = [
    "fastapi==0.120.*",
    "uvicorn==0.38.*",
    "markdown-it-py==4.*",
    "bcrypt==5.*",
]

[dependency-groups]
dev = [
    "pytest>=8.4",
    "httpx>=0.28",
    "playwright>=1.55",
    "pyyaml>=6",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests/service"]
addopts = "-q"
pythonpath = ["."]
