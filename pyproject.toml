[project]
name = "hermes-artifacts"
version = "0.1.0"
description = "Private artifact library for Hermes with explicit, expiring guest shares"
requires-python = ">=3.14,<3.15"
dependencies = [
    "fastapi==0.141.*",
    "uvicorn==0.38.*",
    "markdown-it-py==4.*",
    "bcrypt==5.*",
]

[dependency-groups]
dev = [
    "pytest>=8.4",
    "httpx>=0.28",
    "playwright>=1.55",
    "pyyaml>=6",
]

[tool.uv]
package = false
# Starlette below 1.3.1 carries CVE-2026-48710, -48817, -48818, -54282 and -54283.
constraint-dependencies = ["starlette>=1.3.1"]

[tool.pytest.ini_options]
testpaths = ["tests/service"]
addopts = "-q"
pythonpath = ["."]
